name: Build & Release DeskDangle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

      - name: Build Windows Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: pwsh
        run: |
          try {
            npm run package:win 2>&1 | Tee-Object -FilePath win-build.log
            if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }
          } catch {
            Write-Error "Windows package build failed: $_"
            Get-Content win-build.log -Tail 40 | ForEach-Object { Write-Output "::error title=Windows Build Error::$_" }
            exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            release/*.exe
            release/*.blockmap

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

      - name: Build macOS DMGs & Zips
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -o pipefail
          npm run build
          if ! npx electron-builder --mac 2>&1 | tee mac-build.log; then
            echo "macOS package build failed"
            tail -n 40 mac-build.log | while IFS= read -r line; do
              echo "::error title=Mac Build Error::$line"
            done
            exit 1
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            release/*.dmg
            release/*.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-artifacts

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.zip
          tag_name: ${{ github.ref_name }}
          name: DeskDangle ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
