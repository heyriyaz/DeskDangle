name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in DeskDangle
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if a similar issue already exists before opening a new one.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running DeskDangle on?
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon M-Series)
        - macOS (Intel)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DeskDangle Version
      description: Which version of DeskDangle are you running? (e.g., v2.0.0)
      placeholder: "v2.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Launch DeskDangle
        2. Select charm '...'
        3. Drag top anchor or click ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or logs here.
